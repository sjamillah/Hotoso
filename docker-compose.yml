name: hotoso

services:
  frontend:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://backend:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    image: hotoso-frontend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 200
