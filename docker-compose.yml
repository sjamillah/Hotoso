name: hotoso

services:
  frontend:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://backend:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    image: hotoso-frontend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 200

  backend:
    build:
      context: ./backend
    image: hotoso-backend
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

    # no readonly because gunicorn needs to write
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
