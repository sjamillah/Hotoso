<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Hotoso app icon / favicon: the mark on an ink tile.
       Raw hex is allowed here only because a favicon file can't read CSS
       tokens. Values = --ink #282C20, --paper #E8E5D8, --butter #E8CA78. -->
  <rect width="48" height="48" rx="11" fill="#282C20"/>
  <g transform="translate(7 7) scale(0.708)">
    <rect x="6" y="5" width="10" height="38" rx="5" transform="rotate(4 11 43)" fill="#E8E5D8"/>
    <rect x="32" y="5" width="10" height="38" rx="5" transform="rotate(-4 37 43)" fill="#E8E5D8"/>
    <rect x="12" y="21" width="24" height="7" rx="3.5" fill="#E8E5D8"/>
    <circle cx="24" cy="24.5" r="9.5" fill="#E8CA78" stroke="#E8E5D8" stroke-width="3"/>
  </g>
</svg>
